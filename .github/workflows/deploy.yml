name: Deploy to GitHub Pages

# Every push to main builds the site and publishes it. The repository's Pages source must be "GitHub Actions"
# (Settings > Pages > Build and deployment). The site then lives at https://<user>.github.io/<repo>/ :
#   /           the plain bloom       /home/        the plain bloom       /nivashini/   the birthday card
on:
  push:
    branches: [main]
  workflow_dispatch:

# what the Pages deploy needs: read the code, publish the site, and mint the OIDC token the deploy action uses
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces one that is still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22          # Vite 8 needs Node 20.19+ or 22.12+
          cache: npm

      - run: npm ci

      # no GPU on the runner, so only the Node-only checks run here: crash guard, resolution controller, routes + page generator, quality tiers
      - name: Unit checks
        run: npm run test:unit

      # GITHUB_REPOSITORY makes the build also write dist/404.html with the right base path (see tools/vite-routes.mjs)
      - name: Build
        run: npm run build

      - name: What will be published
        run: find dist -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
